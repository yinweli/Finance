<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root {
  color-scheme: light;
  --page: #f1f0ec; --card: #ffffff; --shadow: rgba(0, 0, 0, .06);
  --surface: #fafaf8; --surface2: #f1f0ec; --line: #dddbd4;
  --ink: #161615; --ink2: #3f3e3a; --ink3: #64635e;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --up: #d03b3b; --down: #0b8a0b; --accent: #2a78d6;
  --fair: rgba(42, 120, 214, .14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #141413; --card: #1d1d1c; --shadow: rgba(0, 0, 0, .4);
    --surface: #222221; --surface2: #2a2a28; --line: #3d3d3a;
    --ink: #f3f2ef; --ink2: #d0cfc6; --ink3: #a5a49c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --up: #e66767; --down: #2fb52f; --accent: #3987e5;
    --fair: rgba(57, 135, 229, .22);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #141413; --card: #1d1d1c; --shadow: rgba(0, 0, 0, .4);
  --surface: #222221; --surface2: #2a2a28; --line: #3d3d3a;
  --ink: #f3f2ef; --ink2: #d0cfc6; --ink3: #a5a49c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --up: #e66767; --down: #2fb52f; --accent: #3987e5;
  --fair: rgba(57, 135, 229, .22);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 19px/1.85 "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}
header.top { padding: 40px 16px 20px; max-width: 880px; margin: 0 auto; text-align: center; }
header.top h1 { margin: 0; font-size: 2.1rem; line-height: 1.35; letter-spacing: .02em; }
header.top .sub { color: var(--ink2); font-size: 1rem; margin-top: 6px; }
nav.toc {
  position: sticky; top: 0; z-index: 5; overflow-x: auto; scrollbar-width: thin;
  background: var(--page); border-bottom: 1px solid var(--line); box-shadow: 0 2px 8px var(--shadow);
}
/* 選單放在內層並置中；寬度超過畫面時改為左右捲動，避免置中把最左邊的項目裁掉 */
nav.toc .toc-inner { display: flex; gap: 6px; width: max-content; margin: 0 auto; padding: 10px 16px; }
nav.toc a {
  white-space: nowrap; color: var(--ink2); text-decoration: none; font-size: 1rem; font-weight: 500;
  padding: 6px 16px; border-radius: 999px; border: 1px solid transparent;
}
nav.toc a:hover { background: var(--card); border-color: var(--line); color: var(--ink); }
nav.toc a.active { background: var(--accent); color: #fff; }
main { max-width: 880px; margin: 0 auto; padding: 8px 16px 64px; }
section {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 28px 36px 20px; margin: 24px 0; scroll-margin-top: 80px;
}
section.summary { background: none; border: 0; border-radius: 0; padding: 0; margin: 0 0 8px; }
h2 { font-size: 1.6rem; line-height: 1.4; margin: 0 0 16px; padding-left: 14px; border-left: 6px solid var(--accent); }
h3 { font-size: 1.25rem; margin: 32px 0 10px; }
h4 { font-size: 1.08rem; margin: 20px 0 8px; color: var(--ink2); }
p { margin: 0 0 1em; }
p, li { color: var(--ink); }
ul, ol { padding-left: 1.4em; }
li { margin: 4px 0; }
a { color: var(--accent); word-break: break-all; }
code { background: var(--surface2); padding: 1px 6px; border-radius: 4px; font-size: .9em; }
.note { color: var(--ink2); font-size: .95rem; }
.verdict {
  font-size: 1.3rem; line-height: 1.7; font-weight: 700; margin: 0 0 20px; padding: 18px 20px;
  background: var(--surface2); border-left: 6px solid var(--accent); border-radius: 10px;
}
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface); }
.tile-label { color: var(--ink2); font-size: 1rem; }
.tile-value { font-size: 1.9rem; line-height: 1.4; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile-note { color: var(--ink2); font-size: .95rem; }
.pills { margin: 16px 0 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 1rem; color: var(--ink); background: var(--surface); }
.up { color: var(--up); font-weight: 700; }
.down { color: var(--down); font-weight: 700; }
.flat { color: var(--ink2); }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.table-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; line-height: 1.65; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:nth-child(even) td { background: var(--surface); }
th { color: var(--ink); font-weight: 700; background: var(--surface2); white-space: nowrap; }
table.scenario td:nth-child(-n+6) { white-space: nowrap; }
ul.events { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 12px; }
li.event { margin: 0; border: 1px solid var(--line); border-left: 5px solid var(--ink3); border-radius: 10px; padding: 12px 16px; background: var(--surface); }
li.event.pending { border-left-color: var(--accent); }
li.event p { margin: 6px 0 4px; }
.event-head { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.event-date { color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.event-name { font-size: 1.05rem; }
.event-meta { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: .95rem; color: var(--ink2); margin-top: 4px; }
.event-meta .tag { border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; background: var(--card); color: var(--ink); }
.event-source { font-size: .9rem; color: var(--ink2); }
.charts { display: grid; gap: 20px; margin-top: 20px; }
figure.chart { margin: 16px 0 0; border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 6px; position: relative; overflow-x: auto; background: var(--card); }
.charts figure.chart { margin: 0; }
figure.chart figcaption { font-weight: 700; font-size: 1.08rem; color: var(--ink); }
figure.chart svg { width: 100%; min-width: 540px; height: auto; display: block; overflow: visible; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .95rem; color: var(--ink2); margin: 6px 0; }
.legend i { display: inline-block; width: 16px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .zero { stroke: var(--ink3); stroke-width: 1; }
svg .axis { fill: var(--ink2); font-size: 14px; }
svg .axis.label { fill: var(--ink2); font-size: 14px; }
svg .value { fill: var(--ink); font-size: 14px; }
svg .band { fill: var(--fair); }
svg .band-label { fill: var(--ink2); font-size: 13px; }
svg .fair { fill: var(--fair); stroke: var(--s1); stroke-width: 1; }
svg .divider { stroke: var(--ink3); stroke-dasharray: 3 3; }
svg .whisker { stroke: var(--ink2); stroke-width: 2; }
svg .forecast { opacity: .45; }
svg .hit { fill: transparent; }
svg .hit:hover { fill: var(--ink); fill-opacity: .05; }
#tip {
  position: fixed; pointer-events: none; z-index: 10; background: var(--ink); color: var(--card);
  padding: 8px 12px; border-radius: 8px; font-size: 1rem; white-space: pre; display: none; line-height: 1.6;
}
#top {
  position: fixed; right: 20px; bottom: 20px; z-index: 6; display: none; cursor: pointer;
  font: inherit; font-size: 1rem; padding: 10px 18px; border-radius: 999px;
  color: #fff; background: var(--accent); border: 0; box-shadow: 0 2px 10px var(--shadow);
}
footer { max-width: 880px; margin: 0 auto; padding: 8px 16px 40px; color: var(--ink2); font-size: .92rem; text-align: center; }
@media (max-width: 640px) {
  body { font-size: 18px; }
  header.top { padding-top: 28px; }
  header.top h1 { font-size: 1.7rem; }
  main { padding: 4px 10px 56px; }
  section { padding: 20px 16px 12px; border-radius: 12px; margin: 16px 0; }
  h2 { font-size: 1.4rem; }
}
@media print {
  nav.toc, #top { display: none; }
  body { background: #fff; }
  section { border: 0; padding: 12px 0; }
  figure.chart { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="top">
  <h1>{{title}}</h1>
  <div class="sub">{{subtitle}}</div>
</header>
<nav class="toc"><div class="toc-inner">{{nav}}</div></nav>
<main>
{{body}}
</main>
<footer>本報告由 Finance 研究流程自動產生：資料由程式抓取公開資訊，研究草稿由 Codex 撰寫，經 Claude 審查修正。內容僅供個人研究參考，不構成投資建議。</footer>
<div id="tip"></div>
<button id="top" type="button" aria-label="回到頂端">↑ 頂端</button>
{{data}}
<script>
(function () {
  var tip = document.getElementById("tip");
  document.addEventListener("mousemove", function (e) {
    var el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (!el) { tip.style.display = "none"; return; }
    tip.textContent = el.getAttribute("data-tip");
    tip.style.display = "block";
    var x = e.clientX + 14, y = e.clientY + 14;
    if (x + tip.offsetWidth > window.innerWidth - 8) x = e.clientX - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  // 選單標出目前閱讀的章節，並把該項目捲到選單中間（手機上選單會左右捲動）
  var nav = document.querySelector("nav.toc"), link = {}, top = document.getElementById("top");
  nav.querySelectorAll("a").forEach(function (a) { link[a.getAttribute("href").slice(1)] = a; });
  var section = document.querySelectorAll("main > section[id]");
  function mark() {
    var line = nav.offsetHeight + 24, current = null;
    section.forEach(function (s) { if (s.getBoundingClientRect().top <= line) current = s.id; });
    if (section.length && window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) current = section[section.length - 1].id;
    Object.keys(link).forEach(function (id) { link[id].classList.toggle("active", id === current); });
    var a = link[current];
    if (a) nav.scrollLeft = a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2;
    top.style.display = window.scrollY > 600 ? "block" : "none";
  }
  window.addEventListener("scroll", mark, { passive: true });
  mark();
  top.addEventListener("click", function () { window.scrollTo({ top: 0 }); });
})();
</script>
</body>
</html>
