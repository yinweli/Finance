<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f1f5f3;
      --surface: #fff;
      --ink: #182d35;
      --muted: #4f646b;
      --line: #d5e1de;
      --accent: #16665b;
      --header: #163740;
      --conservative: #9c4b3f;
      --neutral: #176f62;
      --optimistic: #2b65a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 1rem/1.7 system-ui, "Microsoft JhengHei", sans-serif;
    }
    .wrap { width: min(100% - 1.5rem, 70rem); margin-inline: auto; }
    main { padding-block: 1rem 3rem; }
    header, section, nav { border-radius: .8rem; }
    header, section { padding: clamp(1rem, 4vw, 2.25rem); }
    header { color: #fff; background: var(--header); }
    section, nav {
      margin-top: 1rem;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    nav { display: flex; flex-wrap: wrap; gap: .25rem 1rem; padding: .65rem 1rem; }
    nav a { display: inline-block; padding-block: .25rem; }
    h1, h2, h3 { margin: 0 0 .55em; line-height: 1.25; }
    h1 { font-size: clamp(1.75rem, 5vw, 3rem); }
    h2 { font-size: 1.4rem; }
    h3 { margin-top: 1rem; font-size: 1.1rem; }
    p { margin: 0 0 .8rem; }
    p:last-child { margin-bottom: 0; }
    a { color: var(--accent); }
    header a { color: #c6f0e6; }
    :focus-visible { outline: 2px solid var(--optimistic); outline-offset: 3px; }
    header :focus-visible { outline-color: #c6f0e6; }
    .conclusion { font-size: 1.15rem; }
    .meta, .note, figcaption { color: var(--muted); font-size: .9rem; }
    header .meta { color: #d6e6e4; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr));
      gap: .6rem;
      margin: 1rem 0;
    }
    .metrics > div { padding: .65rem .85rem; border-radius: .5rem; background: #24505a; }
    .metrics dt { color: #e0ecea; font-size: .9rem; }
    .metrics dd { margin: 0; font-size: 1.18rem; font-weight: 700; }
    .table-scroll, .chart-scroll { overflow: auto; margin: .85rem 0; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    caption { margin-bottom: .35rem; text-align: left; font-weight: 650; }
    th, td {
      padding: .55rem .65rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    thead { background: #edf4f1; }
    .numeric { text-align: right; white-space: nowrap; }
    figure { margin: 1rem 0; }
    svg, img, canvas { display: block; max-width: 100%; height: auto; }
    .chart-scroll > .wide-chart { width: 100%; min-width: 38rem; max-width: none; }
    .range-chart { display: grid; gap: .7rem; margin: .85rem 0; }
    .range-row {
      display: grid;
      grid-template-columns: minmax(5rem, 1fr) minmax(4rem, 3fr) auto;
      align-items: center;
      gap: .45rem;
    }
    .range-track { position: relative; height: .7rem; border-radius: .4rem; background: #edf2f0; }
    .range-band { position: absolute; inset-block: 0; border-radius: .4rem; background: var(--accent); }
    .range-band.conservative { background: var(--conservative); }
    .range-band.neutral { background: var(--neutral); }
    .range-band.optimistic { background: var(--optimistic); }
    .range-market { position: absolute; inset-block: -.25rem; width: 2px; background: var(--ink); }
    details { margin-top: .7rem; padding: .6rem .75rem; border: 1px solid var(--line); border-radius: .5rem; }
    summary { cursor: pointer; font-weight: 650; }
    li + li { margin-top: .35rem; }
    @media print {
      body { background: #fff; }
      header, .metrics > div { color: var(--ink); background: #edf4f1; }
      header .meta, .metrics dt { color: var(--muted); }
      header a { color: var(--accent); }
      .chart-scroll > .wide-chart { min-width: 0; }
    }
  </style>
</head>
<!--
  填入雙大括號的欄位。文字欄位做 HTML 跳脫，body 欄位填 HTML 片段。
  metrics 填三至四組 <div><dt>指標及單位</dt><dd>數值</dd></div>。
  寬表格用 .table-scroll 包住，補 caption，數字欄用 .numeric。可捲動區域提供鍵盤焦點及標籤。
  價格區間用 .range-chart 和 .range-row。每列放情境、.range-track 與區間數字。
  在 .range-track 內按同一數軸定位 .range-band 的 left、width 及 .range-market 的 left。
  股價圖等寬圖用 .chart-scroll 與 .wide-chart。圖下保留單位、期間及資料來源。
  script type=application/json 的研究快照欄位為 subject、as_of、input、assumption、formula、source。
  source 各筆可列 name、url、data_date、published_at。用實際研究需要的欄位即可。
  將 JSON 內的字面小於符號跳脫為 \u003c。無快照需求的報告可刪除此區塊。
  需要圖表程式時放在成品檔案內，沿用上方配色並確認可離線操作。
-->
<body>
  <main class="wrap">
    <header>
      <h1>{{title}}</h1>
      <p class="conclusion"><strong>{{conclusion}}</strong></p>
      <p class="meta">研究基準日 {{as_of}}　｜　資料截止 {{data_cutoff}}</p>
      <dl class="metrics">{{metrics}}</dl>
      <p>{{next_review}}</p>
    </header>

    <nav aria-label="報告目錄">
      <a href="#data">資料與基準</a>
      <a href="#analysis">分析與估算</a>
      <a href="#scenarios">情境與比較</a>
      <a href="#review">後續檢視</a>
      <a href="#sources">來源與限制</a>
    </nav>
    <section id="data">
      <h2>資料與基準</h2>
      {{data_body}}
    </section>
    <section id="analysis">
      <h2>分析與估算</h2>
      {{analysis_body}}
    </section>
    <section id="scenarios">
      <h2>情境與比較</h2>
      {{scenarios_body}}
    </section>
    <section id="review">
      <h2>後續檢視</h2>
      {{review_body}}
    </section>
    <section id="sources">
      <h2>來源與限制</h2>
      {{sources_body}}
    </section>
  </main>
  <script id="research-data" type="application/json">
    {{research_data}}
  </script>
</body>
</html>
